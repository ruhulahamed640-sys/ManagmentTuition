name: ManagementTution Android APK Build

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build-debug-apk:
name: Assemble Debug APK (Java 17)
runs-on: ubuntu-latest

steps:
  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Set up JDK 17 (Temurin)
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: platform-tools

  - name: Set up Gradle 8.7 & Cache
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'
      cache-read-only: false

  - name: Ensure gradlew is Executable & Bootstrap Wrapper JAR
    run: |
      chmod +x ./gradlew
      curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

  - name: Run Unit Tests
    run: ./gradlew testDebugUnitTest --stacktrace

  - name: Build Debug APK with Gradle
    run: ./gradlew assembleDebug --stacktrace --info

  - name: Verify Generated APK Exists
    run: |
      ls -lh app/build/outputs/apk/debug/app-debug.apk

  - name: Upload Debug APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: ManagementTution-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 30